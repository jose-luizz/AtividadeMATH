<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de vendas</title>
    <link rel="stylesheet" href="../styles/estilo.css">
</head>
<body>
    <section class="card">
        <h2>Calculadora de venda</h2>
        <form id="calc-form">
            <label for="preco">Preço do produto (R$):</label>
            <input type="number" id="preco" step="0.01" placeholder="Ex: 150.00">

            <label for="desconto">Desconto (R$):</label>
            <input type="number" id="desconto" step="0.5" placeholder="Ex: 10.00">

            <label for="taxa">Taxa do site (%):</label>
            <input type="number" id="taxa" step="0.5" placeholder="Ex: 12">


            <button type="button" onclick="calcular()">Calcular lucro</button>
        </form>
    </section>
    <section id="resultado" class="hidden">
        <p>Valor da Taxa: <span id="out-taxa"></span></p>
        <p>Valor com desconto: <strong id="out-desconto"></strong></p>
        <p>Lucro final: <strong id="out-lucro"></strong></p>
    </section>
    <script src="../scripts/script.js"></script>
</body>
</html>
